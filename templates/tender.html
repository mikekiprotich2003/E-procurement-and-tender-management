{% extends "base.html" %}
{% block content %}
<div class="tender-container">
  <div class="tender-card p-4">
    <h2>Create Tender</h2>
    <form method="POST" enctype="multipart/form-data">
      <label for="title">Title</label>
      <input type="text" name="title" id="title" class="form-control mb-3" required>

      <label for="description">Description</label>
      <textarea name="description" id="description" class="form-control mb-3" required></textarea>

      <label for="deadline">Deadline</label>
      <input type="date" name="deadline" id="deadline" class="form-control mb-3" required>

      <label for="document">Supporting Document (PDF/DOC/DOCX)</label>
      <input type="file" name="document" id="document" class="form-control mb-3">

      <button type="submit" class="btn btn-primary w-100">Create Tender</button>
    </form>
  </div>
</div>
{% endblock %}
