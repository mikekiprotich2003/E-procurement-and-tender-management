<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>E-Procurement System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    .purple-header {
      background-color: #6f42c1; /* Bootstrap purple */
      color: white;
      padding: 15px;
    }
    .sidebar {
      width: 250px;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <!-- Purple Header -->
  <div class="purple-header d-flex justify-content-between align-items-center">
    <h4 class="mb-0">E-Procurement</h4>
    <div>
      <a href="/logout" class="text-white me-3">Logout</a>
      <a href="/register" class="text-white">Register</a>
    </div>
  </div>

  <div class="d-flex">
    <!-- Sidebar -->
    <div class="bg-dark text-white p-3 sidebar">
      <h3 class="mb-4">TProcure</h3>
      <a href="/dashboard" class="text-white d-block mb-2">Dashboard</a>
     <a href="/tenders" class="text-white d-block mb-2">Tenders</a>
      <a href="/bids" class="text-white d-block mb-2">Bids</a>
      <!--<a href="/evaluation" class="text-white d-block mb-2">Evaluation</a>
      <a href="/suppliers" class="text-white d-block mb-2"></a>-->
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1 d-flex flex-column">
      <!-- Top Navbar -->
      <nav class="navbar navbar-light bg-light mb-4">
        <button class="btn btn-primary">New Tender</button>
        <div class="ms-auto">
          <span class="me-3">Procuremently</span>
         
          
        </div>
      </nav>

      <!-- Page Content -->
      <div class="flex-grow-1 p-4">
        {% block content %}{% endblock %}
      </div>

      <!-- Footer -->
      <footer class="bg-light text-center py-3 border-top">
        <small>© 2026 E-Procurement System | Built by Mike</small>
      </footer>
    </div>
  </div>
</body>
</html>
